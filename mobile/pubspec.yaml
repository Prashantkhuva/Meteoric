name: meteoric_admin
description: "A new Flutter project."
publish_to: 'none'
version: 0.22.1+21

environment:
  sdk: ^3.13.0
dependencies:
  animations: ^3.0.0
  crypto: ^3.0.7
  dart_quill_delta: ^10.8.3
  device_info_plus: ^12.0.0
  file_picker: ^10.1.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  flutter_quill_delta_from_html: ^1.5.3
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  razorpay_flutter: ^1.4.2
  shared_preferences: ^2.5.5
  shorebird_code_push: ^2.0.7
  supabase_flutter: ^2.17.2
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  vsc_quill_delta_to_html: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/m.png
    - shorebird.yaml
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
    - family: Clash Display
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.ttf
          weight: 700
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
          weight: 700
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
          weight: 700
