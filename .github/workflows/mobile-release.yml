name: Mobile Release

# Ship Meteoric Admin APK end-to-end with Shorebird OTA registration:
#   build v2-signed APK via shorebird-release@v1 (registers with Shorebird,
#   produces --artifact apk) -> verify gates ->
#   upload to meteoric-app-releases + update Supabase latest.json.
#
# Trigger: tag push vX.Y.Z+N (primary) OR workflow_dispatch (dry-run/override).
# Tag is created by scripts/ship-release.mjs after version bump + commit.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+\+[0-9]+'
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes shown in the in-app update banner
        required: false
        default: ""
      min_build:
        description: "Optional forced-upgrade floor (min_supported_build). Leave empty to skip."
        required: false
        default: ""
      dry_run:
        description: "Validate build/signing/auth without publishing to Shorebird"
        type: boolean
        required: false
        default: false

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ship:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Guard: SHOREBIRD_TOKEN must be present (fail-fast before any build).
      - name: Guard — SHOREBIRD_TOKEN present
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SHOREBIRD_TOKEN" ] || { echo "::error::SHOREBIRD_TOKEN secret missing — mint from Shorebird console (Account → API Keys), then gh secret set SHOREBIRD_TOKEN"; exit 1; }
          echo "SHOREBIRD_TOKEN present"

      # Parse tag → version inputs (tag push path). Dispatch path uses inputs directly.
      - name: Resolve version from tag or dispatch input
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
              echo "::error::tag '$TAG' does not match vX.Y.Z+N — refusing to release"
              exit 1
            fi
            FULL="${TAG#v}"
          else
            # Dispatch path: read from pubspec (prep script already bumped it)
            FULL=$(grep -E '^version:' mobile/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          fi
          PUBSPEC=$(grep -E '^version:' mobile/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SEMVER="${FULL%%+*}"
          BUILD="${FULL##*+}"
          DART_VERSION=$(grep -oE "version = '[^']+'" mobile/lib/core/app_version.dart | sed "s/version = '//;s/'//")
          DART_PATCH=$(grep -oE 'patch = [0-9]+' mobile/lib/core/app_version.dart | grep -oE '[0-9]+')
          {
            echo "full=$FULL"
            echo "pubspec_version=$PUBSPEC"
            echo "semver=$SEMVER"
            echo "build=$BUILD"
            echo "dart_version=$DART_VERSION"
            echo "dart_patch=$DART_PATCH"
          } >> "$GITHUB_OUTPUT"
          echo "resolved=$FULL  pubspec=$PUBSPEC  app_version.dart=$DART_VERSION  patch=$DART_PATCH"

      # Guard: version mismatch = updater parses wrong build number.
      - name: Guard — pubspec version matches app_version.dart
        run: |
          set -euo pipefail
          if [ "${{ steps.ver.outputs.full }}" != "${{ steps.ver.outputs.dart_version }}" ]; then
            echo "::error::tag/dispatch version (${{ steps.ver.outputs.full }}) != app_version.dart (${{ steps.ver.outputs.dart_version }}). Fix and re-run."
            exit 1
          fi
          if [ "${{ steps.ver.outputs.pubspec_version }}" != "${{ steps.ver.outputs.dart_version }}" ]; then
            echo "::error::pubspec.yaml (${{ steps.ver.outputs.pubspec_version }}) != app_version.dart (${{ steps.ver.outputs.dart_version }}). Fix and re-run."
            exit 1
          fi
          echo "versions match: tag/dispatch=${{ steps.ver.outputs.full }}  pubspec=${{ steps.ver.outputs.pubspec_version }}  dart=${{ steps.ver.outputs.dart_version }}"

      # Guard: a release must reset the patch field (new base = patch 0).
      - name: Guard — release resets patch field to 0
        run: |
          set -euo pipefail
          if [ "${{ steps.ver.outputs.dart_patch }}" -ne 0 ]; then
            echo "::error::mode is release but app_version.dart patch=${{ steps.ver.outputs.dart_patch }}. Reset patch to 0."
            exit 1
          fi
          echo "patch field ok: 0"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Guard — Android SDK present
        run: |
          set -euo pipefail
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::ANDROID_HOME not set on runner"; exit 1; }
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "build-tools $BT at $ANDROID_HOME/build-tools/$BT"
          [ -x "$ANDROID_HOME/build-tools/$BT/apksigner" ] || { echo "::error::apksigner missing"; exit 1; }
          [ -x "$ANDROID_HOME/build-tools/$BT/aapt" ] || { echo "::error::aapt missing"; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-sdk-stable
          pub-cache: true
          pub-cache-key: pub-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Setup Shorebird
        id: shorebird-setup
        uses: shorebirdtech/setup-shorebird@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          cache: true

      - name: Decode signing + Firebase secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPS_B64: ${{ secrets.KEY_PROPERTIES_B64 }}
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 missing"; exit 1; }
          [ -n "$KEY_PROPS_B64" ] || { echo "::error::KEY_PROPERTIES_B64 missing"; exit 1; }
          [ -n "$GS_JSON_B64" ] || { echo "::error::GOOGLE_SERVICES_JSON_B64 missing"; exit 1; }
          echo "$KEYSTORE_B64"  | base64 -d > "$RUNNER_TEMP/meteoric-release.jks"
          echo "$KEY_PROPS_B64" | base64 -d > mobile/android/key.properties
          sed -i "s|^storeFile=.*|storeFile=$RUNNER_TEMP/meteoric-release.jks|" mobile/android/key.properties
          echo "$GS_JSON_B64"  | base64 -d > mobile/android/app/google-services.json
          [ -s "$RUNNER_TEMP/meteoric-release.jks" ] || { echo "::error::keystore decode produced empty file"; exit 1; }
          grep -q 'com.meteoric.meteoric_admin' mobile/android/app/google-services.json \
            || { echo "::error::google-services.json package mismatch"; exit 1; }
          grep -q '^storeFile=' mobile/android/key.properties \
            || { echo "::error::key.properties missing storeFile"; exit 1; }
          echo "secrets decoded + sanity-checked"

      - name: Quality gate — analyze + test
        run: |
          set -euo pipefail
          cd mobile
          flutter pub get
          flutter analyze --no-pub
          flutter test

      # Shorebird release: builds APK, registers with Shorebird, produces
      # --artifact apk (NOT default AAB — download page needs real .apk).
      # Flutter-only flags after -- separator. dry_run appends --dry-run.
      - name: Shorebird release (build + register)
        id: shorebird-release
        uses: shorebirdtech/shorebird-release@v1
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          flutter-version: 3.47.7
          platform: android
          working-directory: ./mobile
          args: >-
            --artifact apk
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
            -- --no-tree-shake-icons

      # Guard: APK must exist (catches forgotten --artifact apk / AAB-only).
      - name: Guard — APK exists after Shorebird build
        run: |
          set -euo pipefail
          APK=mobile/build/app/outputs/flutter-apk/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK not found at $APK — --artifact apk missing or build failed"; exit 1; }
          ls -la "$APK"

      - name: Verify signature (v2, never jarsigner)
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=mobile/build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt \
            || { echo "::error::v2 signature missing — refusing to ship"; exit 1; }
          if grep -qi "jarsigner" apksigner.txt; then
            echo "::error::jarsigner present — refusing to ship"
            exit 1
          fi

      - name: Verify versionCode beats published highest_build
        run: |
          set -euo pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=mobile/build/app/outputs/flutter-apk/app-release.apk
          VC=$("$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -o "versionCode='[0-9]*'" | grep -o '[0-9]*')
          REMOTE=$(curl -sf "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/public/app-releases/latest.json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('highest_build') or d.get('build') or 0)" 2>/dev/null || echo 0)
          echo "APK versionCode=$VC remote highest_build=$REMOTE"
          [ "$VC" -gt "$REMOTE" ] \
            || { echo "::error::versionCode $VC <= highest_build $REMOTE — would INSTALL_FAILED_VERSION_DOWNGRADE"; exit 1; }

      - name: Upload release (GitHub asset + Supabase latest.json)
        if: inputs.dry_run != true
        env:
          NOTES: ${{ inputs.notes }}
          MIN_BUILD: ${{ inputs.min_build }}
        run: |
          set -euo pipefail
          npm install --no-save @supabase/supabase-js
          [ -n "$GH_TOKEN" ] || { echo "::error::RELEASE_REPO_TOKEN missing — cannot upload assets"; exit 1; }
          ARGS=(mobile/build/app/outputs/flutter-apk/app-release.apk "${{ steps.ver.outputs.semver }}" "${{ steps.ver.outputs.build }}" "$NOTES")
          if [ -n "$MIN_BUILD" ]; then ARGS+=(--min-build "$MIN_BUILD"); fi
          node scripts/upload-app-release.mjs "${ARGS[@]}"

      - name: Verify manifest + download page
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          curl -sf "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/public/app-releases/latest.json" | python3 -m json.tool
          # Browser UA — Cloudflare bot-blocks bare curl from Actions runner IPs (returns 403).
          CODE=$(curl -sI -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://app.withmeteoric.com/download)
          [ "$CODE" = "200" ] || { echo "::error::download page returned $CODE"; exit 1; }
          echo "download page OK"

      - name: Archive APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.ver.outputs.full }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Shorebird doctor (diagnostics on failure)
        if: failure() && steps.shorebird-setup.outcome == 'success'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird doctor --verbose

      - name: Step summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### 🚀 Release shipped — ${{ steps.ver.outputs.full }}"
            else
              echo "### ❌ Mobile release failed — see run logs"
            fi
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.ver.outputs.full }}\` |"
            echo "| Shorebird release-version | \`${{ steps.shorebird-release.outputs.release-version }}\` |"
            echo "| Notes | ${{ inputs.notes }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"
